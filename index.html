<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Kişilik 101 Okey Plus</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
        body { background: #0a1f0a; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .masa-container { flex: 1; display: flex; flex-direction: column; padding: 10px; justify-content: space-between; background: radial-gradient(circle, #1e5c1e 0%, #051405 100%); }
        .rakipler-alan { display: flex; justify-content: space-around; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 8px; }
        .rakip-kutu { background: rgba(18, 51, 18, 0.9); border: 1px solid #2e7d32; padding: 6px 16px; border-radius: 8px; text-align: center; }
        .rakip-kutu.aktif { border: 2px solid #ffeb3b; box-shadow: 0 0 10px #ffeb3b; }

        .orta-masa { display: flex; justify-content: space-around; align-items: center; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 12px; }
        .kutucuk { background: rgba(0,0,0,0.6); padding: 8px 14px; border-radius: 8px; text-align: center; font-size: 12px; border: 1px solid rgba(255, 179, 0, 0.4); }

        .oyuncu-alan { background: #180d05; border-top: 3px solid #ffb300; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .istaka-kontrol { display: flex; justify-content: space-between; align-items: center; }
        
        .istaka-ve-atma { display: flex; gap: 10px; align-items: center; }
        .ahsap-istaka { background: #3d220f; border: 3px solid #1a0d05; border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 6px; flex: 1; overflow-x: auto; }
        .istaka-satir { display: flex; gap: 4px; background: #140a04; padding: 4px; border-radius: 4px; min-width: 600px; }
        .yuva { width: 36px; height: 50px; border: 1px dashed rgba(255,255,255,0.1); border-radius: 4px; }

        .tas { width: 100%; height: 100%; background: #f4ebd9; border-radius: 4px; border-bottom: 3px solid #b39b6e; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; cursor: pointer; color: #111; position: relative; }
        .tas.secili { transform: translateY(-6px); border: 2px solid #ff6f00; background: #fffde7; }
        .okey-rozeti { position: absolute; top: 1px; right: 1px; font-size: 7px; background: #d32f2f; color: #ffeb3b; padding: 1px; border-radius: 2px; }

        .kirmizi { color: #d32f2f; } .siyah { color: #111; } .mavi { color: #1976d2; } .sari { color: #f57f17; } .sahte { color: #7b1fa2; }

        .sag-tas-atma { width: 80px; height: 110px; background: #7f1d1d; border: 2px dashed #ffeb3b; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; cursor: pointer; }
        button { background: #ffb300; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="masa-container">
    <div class="rakipler-alan" id="rakipler-alan"></div>

    <div class="orta-masa">
        <div class="kutucuk">Deste<br><strong id="kalan-tas" style="color:#ffeb3b;">-</strong><br><button id="btn-tas-cek" style="display:none;" onclick="tasCek()">Taş Çek</button></div>
        <div class="kutucuk">Gösterge<br><div id="okey-tas"></div></div>
        <div class="kutucuk">Açma Barajı<br><strong id="baraj-puan" style="color:#4caf50;">101</strong></div>
        <div class="kutucuk">Son Atılan<br><div id="son-atilan-tas"></div><button id="btn-yandan-al" style="display:none;" onclick="yandanTasAl()">Yandan Al</button></div>
        <button onclick="socket.emit('oyunuBaslat')">Eli Başlat</button>
    </div>

    <div class="oyuncu-alan">
        <div class="istaka-kontrol">
            <div><strong id="benim-bilgi" style="color:#ffeb3b;">Oyuncu</strong> | <span id="ceza-bilgi" style="color:#ff5252;">Ceza: 0</span></div>
            <div>
                <button onclick="seriDiz()">Seri Diz</button>
                <button onclick="ciftDiz()">Çift Diz</button>
                <button style="background:#4caf50; color:white;" onclick="perAc()">Per Aç</button>
                <button style="background:#d32f2f; color:white;" onclick="tasAt()">Taş At</button>
            </div>
        </div>

        <div class="istaka-ve-atma">
            <div class="ahsap-istaka">
                <div class="istaka-satir" id="ust-satir"></div>
                <div class="istaka-satir" id="alt-satir"></div>
            </div>
            <div class="sag-tas-atma" onclick="tasAt()">📥<br>TAŞ AT</div>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let benimKoltugum = -1;
    let seciliIndices = [];
    let state = null;
    let localIstaka = new Array(36).fill(null);
    let yandanTasAldiMi = false;

    function istakaInit() {
        const ust = document.getElementById('ust-satir');
        const alt = document.getElementById('alt-satir');
        ust.innerHTML = ''; alt.innerHTML = '';
        for (let i = 0; i < 18; i++) ust.appendChild(createSlot(i));
        for (let i = 18; i < 36; i++) alt.appendChild(createSlot(i));
    }

    function createSlot(index) {
        let slot = document.createElement('div');
        slot.className = 'yuva'; slot.dataset.index = index;
        return slot;
    }

    socket.on('playerAssigned', (index) => {
        benimKoltugum = index;
        document.getElementById('benim-bilgi').innerText = index !== -1 ? `Oyuncu ${index + 1}` : "İzleyici";
    });

    socket.on('bildirim', (msg) => alert(msg));
    socket.on('yandanTasAldiBildir', () => { yandanTasAldiMi = true; });

    socket.on('stateUpdate', (newState) => {
        state = newState;
        if (state && benimKoltugum !== -1 && state.oyuncular[benimKoltugum]) {
            syncServerTaslarToLocal(state.oyuncular[benimKoltugum].taslar);
        }
        ekraniGuncelle();
    });

    function syncServerTaslarToLocal(serverTaslar) {
        let newLocal = new Array(36).fill(null);
        let tempServer = [...serverTaslar];

        for (let i = 0; i < 36; i++) {
            if (localIstaka[i]) {
                let foundIdx = tempServer.findIndex(t => t.id === localIstaka[i].id);
                if (foundIdx !== -1) newLocal[i] = tempServer.splice(foundIdx, 1)[0];
            }
        }
        for (let i = 0; i < 36; i++) {
            if (!newLocal[i] && tempServer.length > 0) newLocal[i] = tempServer.shift();
        }
        localIstaka = newLocal;
    }

    function isOkey(tas) {
        if (!state || !state.okey || !tas) return false;
        let okeySayi = state.okey.sayi === 13 ? 1 : state.okey.sayi + 1;
        return tas.renk === state.okey.renk && tas.sayi === okeySayi;
    }

    function tasCek() { yandanTasAldiMi = false; socket.emit('tasCek', benimKoltugum); }
    function yandanTasAl() { socket.emit('yandanTasAl', benimKoltugum); }

    function ekraniGuncelle() {
        if (!state) return;

        document.getElementById('kalan-tas').innerText = state.deste.length;
        document.getElementById('baraj-puan').innerText = state.enYuksekAcilanPuan + 1;

        if (state.okey) {
            document.getElementById('okey-tas').innerHTML = `<div class="tas ${state.okey.renk}" style="width:28px; height:40px;">${state.okey.sayi}</div>`;
        }

        if (state.sonAtilanTas) {
            document.getElementById('son-atilan-tas').innerHTML = `<div class="tas ${state.sonAtilanTas.renk}" style="width:28px; height:40px;">${state.sonAtilanTas.sayi === 0 ? 'J' : state.sonAtilanTas.sayi}</div>`;
        } else {
            document.getElementById('son-atilan-tas').innerHTML = '<small style="color:#aaa;">Yok</small>';
        }

        let rakiplerDiv = document.getElementById('rakipler-alan');
        rakiplerDiv.innerHTML = '';
        state.oyuncular.forEach((o, idx) => {
            if (idx !== benimKoltugum) {
                let rDiv = document.createElement('div');
                rDiv.className = `rakip-kutu ${idx === state.aktifOyuncu ? 'aktif' : ''}`;
                rDiv.innerHTML = `<strong>${o.isim}</strong><br><small style="color:#ffeb3b;">Taş: ${o.taslar.length} | Ceza: ${o.ceza}</small>`;
                rakiplerDiv.appendChild(rDiv);
            } else {
                document.getElementById('ceza-bilgi').innerText = `Ceza: ${o.ceza}`;
            }
        });

        let siraBende = (benimKoltugum === state.aktifOyuncu);
        document.getElementById('btn-tas-cek').style.display = (siraBende && !state.tasCekildiMi) ? 'inline-block' : 'none';
        document.getElementById('btn-yandan-al').style.display = (siraBende && !state.tasCekildiMi && state.sonAtilanTas) ? 'inline-block' : 'none';

        for (let i = 0; i < 36; i++) {
            let slot = document.querySelector(`.yuva[data-index="${i}"]`);
            slot.innerHTML = '';
            let t = localIstaka[i];
            if (t) {
                let tDiv = document.createElement('div');
                tDiv.className = `tas ${t.renk} ${seciliIndices.includes(t.id) ? 'secili' : ''}`;
                let htmlContent = t.sayi === 0 ? 'J' : t.sayi;
                if (isOkey(t)) htmlContent += `<span class="okey-rozeti">★</span>`;
                tDiv.innerHTML = htmlContent;
                tDiv.onclick = () => tasSec(t.id);
                slot.appendChild(tDiv);
            }
        }
    }

    function tasSec(tasId) {
        let pos = seciliIndices.indexOf(tasId);
        if (pos === -1) seciliIndices.push(tasId);
        else seciliIndices.splice(pos, 1);
        ekraniGuncelle();
    }

    function perAc() {
        if (seciliIndices.length < 3) {
            alert("Per açmak için en az 3 taş seçmelisin!");
            return;
        }
        let acilacakIndices = seciliIndices.map(id => state.oyuncular[benimKoltugum].taslar.findIndex(t => t.id === id));
        socket.emit('seriAc', { pIdx: benimKoltugum, seciliIndices: acilacakIndices });
        seciliIndices = [];
    }

    function tasAt() {
        if (seciliIndices.length !== 1) { 
            alert("Atmak için 1 taş seçmelisin!"); 
            return; 
        }

        if (yandanTasAldiMi && !state.oyuncular[benimKoltugum].elAcaliMi) {
            socket.emit('yandanTasCezasiYaz', { pIdx: benimKoltugum });
        }

        let tasId = seciliIndices[0];
        let realIndex = state.oyuncular[benimKoltugum].taslar.findIndex(t => t.id === tasId);
        
        if (realIndex !== -1) {
            socket.emit('tasAt', { pIdx: benimKoltugum, tasIndex: realIndex });
            seciliIndices = [];
            yandanTasAldiMi = false;
        }
    }

    function seriDiz() {
        if (benimKoltugum === -1 || !state) return;
        let taslar = [...state.oyuncular[benimKoltugum].taslar];
        const renkSira = { 'kirmizi': 1, 'siyah': 2, 'mavi': 3, 'sari': 4, 'sahte': 5 };
        taslar.sort((a, b) => (renkSira[a.renk] !== renkSira[b.renk]) ? renkSira[a.renk] - renkSira[b.renk] : a.sayi - b.sayi);
        localIstaka = new Array(36).fill(null);
        taslar.forEach((t, i) => localIstaka[i] = t);
        seciliIndices = [];
        ekraniGuncelle();
    }

    function ciftDiz() {
        if (benimKoltugum === -1 || !state) return;
        let taslar = [...state.oyuncular[benimKoltugum].taslar];
        taslar.sort((a, b) => a.sayi - b.sayi);
        localIstaka = new Array(36).fill(null);
        taslar.forEach((t, i) => localIstaka[i] = t);
        seciliIndices = [];
        ekraniGuncelle();
    }

    istakaInit();
</script>
</body>
</html>

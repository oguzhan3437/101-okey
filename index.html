<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>101 Okey - 3 Kişilik Canlı Masa</title>
  <script src="/socket.io/socket.io.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #1b4332;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .game-board {
      position: relative;
      width: 100%;
      height: calc(100vh - 180px);
    }

    .player-slot {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 8px;
      border-radius: 12px;
      transition: all 0.3s ease;
    }

    .player-slot.active-turn {
      background: rgba(255, 215, 0, 0.25);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
      border: 1px solid rgba(255, 215, 0, 0.8);
    }

    .player-info {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .slot-p1 { bottom: 20px; right: 15%; }
    .slot-p2 { top: 40px; left: 5%; }
    .slot-p3 { top: 40px; right: 5%; flex-direction: row-reverse; }

    .discard-zone {
      width: 50px;
      height: 70px;
      border: 2px dashed rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
    }

    .center-deck-area {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .deck-stack {
      width: 54px;
      height: 76px;
      background: #2b2b2b;
      border: 2px solid #fff;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .deck-count {
      position: absolute;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      z-index: 2;
    }

    .indicator-box {
      width: 50px;
      height: 70px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.1);
    }

    .status-bar {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: #ffd700;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      border: 1px solid rgba(255,215,0,0.3);
    }

    .rack-container {
      width: 100%;
      height: 170px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 10px;
      gap: 6px;
    }

    .rack-controls {
      display: flex;
      gap: 10px;
    }

    .btn-sort {
      background: #2d6a4f;
      color: white;
      border: 1px solid #52b788;
      padding: 4px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .btn-sort:hover { background: #40916c; }

    .rack-wood {
      width: min(90vw, 780px);
      height: 135px;
      background: linear-gradient(180deg, #5c3a21 0%, #3d2413 100%);
      border: 4px solid #2b180b;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.2);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .rack-row {
      display: flex;
      gap: 4px;
      height: 58px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 4px;
      padding: 2px 4px;
      overflow-x: auto;
    }

    .tile {
      width: 42px;
      height: 56px;
      background: #fdfbf7;
      border-radius: 5px;
      box-shadow: 0 3px 5px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.1s ease;
      flex-shrink: 0;
    }

    .tile:hover { transform: translateY(-4px); }
    .tile.selected { border: 2px solid #ffb703; transform: translateY(-6px); }
    .tile.is-okey { border: 2px solid #7209b7; background: #f0e6ff; }

    .tile.kirmizi { color: #d62828; }
    .tile.siyah { color: #000000; }
    .tile.mavi { color: #0077b6; }
    .tile.sari { color: #f2a900; }
    .tile.joker { color: #7209b7; }
  </style>
</head>
<body>

  <div class="game-container">
    <div id="status-bar" class="status-bar">Oyuncular Bekleniyor...</div>

    <div class="game-board">
      <!-- OYUNCU 2 (SOL ÜST) -->
      <div class="player-slot slot-p2" id="slot-p2">
        <div class="player-info">
          <span class="avatar">👤</span>
          <span class="player-name" id="name-p2">Oyuncu 2 Bekleniyor...</span>
        </div>
        <div class="discard-zone" id="discard-p2"><span class="zone-label">Atılan</span></div>
      </div>

      <!-- OYUNCU 3 (SAĞ ÜST) -->
      <div class="player-slot slot-p3" id="slot-p3">
        <div class="discard-zone" id="discard-p3"><span class="zone-label">Atılan</span></div>
        <div class="player-info">
          <span class="avatar">👤</span>
          <span class="player-name" id="name-p3">Oyuncu 3 Bekleniyor...</span>
        </div>
      </div>

      <!-- ORTA DESTE VE GÖSTERGE -->
      <div class="center-deck-area">
        <div class="deck-stack" id="draw-deck" onclick="drawTile()">
          <div class="tile tile-back">🂠</div>
          <span class="deck-count" id="deck-count">106</span>
        </div>
        <div class="indicator-box" id="indicator-box"></div>
      </div>

      <!-- SİZ (P1) -->
      <div class="player-slot slot-p1" id="slot-p1">
        <div class="discard-zone" id="discard-p1" onclick="throwSelectedTile()">
          <span class="zone-label">Atılan</span>
        </div>
      </div>
    </div>

    <!-- ISTAKA VE SIRALAMA BUTONLARI -->
    <div class="rack-container">
      <div class="rack-controls">
        <button class="btn-sort" onclick="sortRack('seri')">Seri Sırala</button>
        <button class="btn-sort" onclick="sortRack('cift')">Çift Sırala</button>
      </div>
      <div class="rack-wood" id="player-rack">
        <div class="rack-row upper-row" id="rack-upper"></div>
        <div class="rack-row lower-row" id="rack-lower"></div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();

    let myRack = [];
    let selectedTileIndex = null;
    let myPlayerId = null;
    let currentTurn = null;
    let okeyTile = null;

    socket.on('connect', () => {
      console.log("Sunucuya bağlandık:", socket.id);
    });

    socket.on('initGame', (data) => {
      myRack = data.hand || [];
      myPlayerId = data.playerId;
      okeyTile = data.okey;

      renderRack();
      if(data.indicator) {
        document.getElementById('indicator-box').innerHTML = renderTileHTML(data.indicator);
      }
    });

    socket.on('updateGameState', (state) => {
      if (state.deckCount !== undefined) {
        document.getElementById('deck-count').innerText = state.deckCount;
      }

      currentTurn = state.currentTurn;
      updateTurnUI();

      if(state.players) {
        if(state.players[1]) document.getElementById('name-p2').innerText = state.players[1].name || "Oyuncu 2";
        if(state.players[2]) document.getElementById('name-p3').innerText = state.players[2].name || "Oyuncu 3";
      }

      if (state.discards) {
        Object.keys(state.discards).forEach(pKey => {
          updateDiscardZone(pKey, state.discards[pKey]);
        });
      }
    });

    socket.on('tileDrawn', (tile) => {
      myRack.push(tile);
      renderRack();
    });

    socket.on('errorMessage', (msg) => {
      alert(msg);
    });

    function updateTurnUI() {
      ['p1', 'p2', 'p3'].forEach(p => {
        const slot = document.getElementById(`slot-${p}`);
        if(slot) slot.classList.remove('active-turn');
      });

      const activeSlot = document.getElementById(`slot-${currentTurn}`);
      if(activeSlot) activeSlot.classList.add('active-turn');

      const statusBar = document.getElementById('status-bar');
      if (currentTurn === myPlayerId) {
        statusBar.innerText = "Sıra Sizde! Taş Çekin veya Taş Atın.";
        statusBar.style.color = "#52b788";
      } else {
        statusBar.innerText = `Sıra Diğer Oyuncuda (${currentTurn ? currentTurn.toUpperCase() : '...'})`;
        statusBar.style.color = "#ffd700";
      }
    }

    function drawTile() {
      if (currentTurn !== myPlayerId) {
        alert("Sıra sizde değil!");
        return;
      }
      socket.emit('drawTile');
    }

    function selectTile(index) {
      selectedTileIndex = index;
      renderRack();
    }

    function throwSelectedTile() {
      if (currentTurn !== myPlayerId) {
        alert("Sıra sizde değil!");
        return;
      }
      if (selectedTileIndex === null) {
        alert("Lütfen önce atılacak taşı seçin!");
        return;
      }

      const thrownTile = myRack.splice(selectedTileIndex, 1)[0];
      selectedTileIndex = null;
      renderRack();

      socket.emit('throwTile', { tile: thrownTile });
    }

    function updateDiscardZone(playerId, tile) {
      const zoneElem = document.getElementById(`discard-${playerId}`);
      if (!zoneElem) return;

      if (!tile) {
        zoneElem.innerHTML = `<span class="zone-label">Atılan</span>`;
        return;
      }

      zoneElem.innerHTML = renderTileHTML(tile);
    }

    function renderTileHTML(tile, index = null) {
      const isSelected = index === selectedTileIndex ? 'selected' : '';
      const clickAttr = index !== null ? `onclick="selectTile(${index})"` : '';
      
      const isOkey = okeyTile && tile.color === okeyTile.color && tile.value === okeyTile.value;
      const okeyClass = isOkey ? 'is-okey' : '';

      return `
        <div class="tile ${tile.color} ${isSelected} ${okeyClass}" ${clickAttr}>
          <span>${tile.value}</span>
        </div>
      `;
    }

    function renderRack() {
      const upperRow = document.getElementById('rack-upper');
      const lowerRow = document.getElementById('rack-lower');

      upperRow.innerHTML = '';
      lowerRow.innerHTML = '';

      const half = Math.ceil(myRack.length / 2);
      const upperTiles = myRack.slice(0, half);
      const lowerTiles = myRack.slice(half);

      upperTiles.forEach((tile, idx) => {
        upperRow.innerHTML += renderTileHTML(tile, idx);
      });

      lowerTiles.forEach((tile, idx) => {
        lowerRow.innerHTML += renderTileHTML(tile, idx + half);
      });
    }

    // SIRALAMA MANTIKLARI
    function sortRack(type) {
      const colorOrder = { 'kirmizi': 1, 'siyah': 2, 'mavi': 3, 'sari': 4, 'joker': 5 };

      if (type === 'seri') {
        myRack.sort((a, b) => {
          if (colorOrder[a.color] !== colorOrder[b.color]) {
            return colorOrder[a.color] - colorOrder[b.color];
          }
          return (parseInt(a.value) || 99) - (parseInt(b.value) || 99);
        });
      } else if (type === 'cift') {
        myRack.sort((a, b) => {
          return (parseInt(a.value) || 99) - (parseInt(b.value) || 99);
        });
      }
      renderRack();
    }
  </script>
</body>
</html>

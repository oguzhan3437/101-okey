<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Kişilik 101 Okey</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f380f; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Masa Alanı */
        .masa-container { flex: 1; display: grid; grid-template-rows: 80px 1fr 200px; padding: 10px; gap: 10px; }
        
        /* Üst Rakip Alanı */
        .rakipler-alan { display: flex; justify-content: space-around; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; }
        .rakip-kutu { background: #1f521f; border: 1px solid #3d8c3d; padding: 8px 15px; border-radius: 6px; text-align: center; }
        .rakip-kutu.aktif { border: 2px solid #ffeb3b; box-shadow: 0 0 10px #ffeb3b; }

        /* Orta Masa Alanı */
        .orta-masa { display: flex; justify-content: space-around; align-items: center; background: #174217; border: 4px solid #0b290b; border-radius: 15px; padding: 10px; position: relative; }
        .deste-alan, .gosterge-alan, .atilan-alan { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; text-align: center; min-width: 100px; }
        
        /* Istaka ve Oyuncu Alanı */
        .oyuncu-alan { background: #3d2314; border-top: 5px solid #24140b; padding: 10px; border-radius: 12px 12px 0 0; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); }
        .istaka-kontrol { display: flex; justify-content: space-between; align-items: center; }
        
        /* Gerçek Istaka Görünümü */
        .istaka { background: #5c3a21; border: 4px solid #382213; border-radius: 6px; padding: 10px; min-height: 110px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; box-shadow: inset 0 0 10px #000; }

        /* Taş Tasarımı */
        .tas { width: 36px; height: 50px; background: #fffdf0; border-radius: 4px; border-bottom: 3px solid #ccc; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; cursor: pointer; user-select: none; box-shadow: 1px 2px 4px rgba(0,0,0,0.4); position: relative; transition: transform 0.1s; }
        .tas.secili { transform: translateY(-12px); border: 2px solid #e65100; background: #fff9c4; }
        
        .kirmizi { color: #d32f2f; }
        .siyah { color: #212121; }
        .mavi { color: #1976d2; }
        .sari { color: #f57f17; }
        .sahte { color: #8e24aa; }

        /* Butonlar */
        button { background: #ffb300; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; color: #333; }
        button:hover { background: #ffa000; }
        .btn-aksiyon { background: #4caf50; color: white; padding: 8px 16px; font-size: 14px; }
        .btn-diz { background: #0288d1; color: white; }

        /* Per Alanları */
        .acilan-perler { display: flex; gap: 8px; flex-wrap: wrap; max-height: 80px; overflow-y: auto; }
        .per-grup { display: flex; background: rgba(0,0,0,0.4); padding: 3px; border-radius: 4px; border: 1px solid #777; }
    </style>
</head>
<body>

<div class="masa-container">
    <!-- Rakipler -->
    <div class="rakipler-alan" id="rakipler-alan"></div>

    <!-- Orta Masa -->
    <div class="orta-masa">
        <div class="deste-alan">
            <small>Deste</small>
            <div id="kalan-tas" style="font-size: 20px; font-weight: bold;">-</div>
            <button id="btn-tas-cek" style="display:none;" onclick="socket.emit('tasCek', benimKoltugum)">Taş Çek</button>
        </div>

        <div class="gosterge-alan">
            <small>OKEY / Gösterge</small>
            <div id="okey-tas"></div>
        </div>

        <div class="atilan-alan">
            <small>Son Atılan Taş</small>
            <div id="son-atilan-tas"></div>
            <button id="btn-yandan-al" style="display:none; margin-top:4px;" onclick="socket.emit('yandanTasAl', benimKoltugum)">Yandan Al</button>
        </div>

        <div>
            <button onclick="socket.emit('oyunuBaslat')">Oyunu / Eli Başlat</button>
        </div>
    </div>

    <!-- Benim Istakam ve Kontroller -->
    <div class="oyuncu-alan">
        <div class="istaka-kontrol">
            <div>
                <span id="benim-bilgi" style="font-weight: bold; color: #ffeb3b;">Oyuncu</span>
                <span id="benim-puan" style="margin-left: 10px; font-size: 12px;">Seri Puanı: 0 | Ceza: 0</span>
            </div>
            <div>
                <button class="btn-diz" onclick="seriDiz()">Seri Diz</button>
                <button class="btn-diz" onclick="ciftDiz()">Çift Diz</button>
                <button class="btn-aksiyon" id="btn-seri-ac" onclick="seriAc()">Seri Per Aç</button>
                <button class="btn-aksiyon" style="background:#d32f2f;" onclick="tasAt()">Yere Taş At</button>
            </div>
        </div>

        <!-- Istaka -->
        <div class="istaka" id="benim-istaka"></div>
    </div>
</div>

<script>
    const socket = io();
    let benimKoltugum = -1;
    let seciliIndices = [];
    let state = null;

    socket.on('playerAssigned', (index) => {
        benimKoltugum = index;
        document.getElementById('benim-bilgi').innerText = index !== -1 ? `Oyuncu ${index + 1} (SENSİN)` : "İzleyicisin";
    });

    socket.on('bildirim', (msg) => alert(msg));

    socket.on('stateUpdate', (newState) => {
        state = newState;
        ekraniGuncelle();
    });

    function tasSec(idx) {
        let pos = seciliIndices.indexOf(idx);
        if (pos === -1) seciliIndices.push(idx);
        else seciliIndices.splice(pos, 1);
        ekraniGuncelle();
    }

    function ekraniGuncelle() {
        if (!state) return;

        // Masa Bilgileri
        document.getElementById('kalan-tas').innerText = state.deste.length;
        
        if (state.okey) {
            document.getElementById('okey-tas').innerHTML = `<div class="tas ${state.okey.renk}">${state.okey.sayi}</div>`;
        }

        if (state.sonAtilanTas) {
            document.getElementById('son-atilan-tas').innerHTML = `<div class="tas ${state.sonAtilanTas.renk}">${state.sonAtilanTas.sayi}</div>`;
        } else {
            document.getElementById('son-atilan-tas').innerHTML = '<small>Yok</small>';
        }

        // Rakipleri Çiz
        let rakiplerDiv = document.getElementById('rakipler-alan');
        rakiplerDiv.innerHTML = '';
        state.oyuncular.forEach((o, idx) => {
            if (idx !== benimKoltugum) {
                let rDiv = document.createElement('div');
                rDiv.className = `rakip-kutu ${idx === state.aktifOyuncu ? 'aktif' : ''}`;
                rDiv.innerHTML = `
                    <strong>${o.isim}</strong> <br>
                    <small>Taş: ${o.taslar.length} | Ceza: ${o.ceza}</small>
                `;
                rakiplerDiv.appendChild(rDiv);
            }
        });

        // Buton Durumları
        let siraBende = (benimKoltugum === state.aktifOyuncu);
        document.getElementById('btn-tas-cek').style.display = (siraBende && !state.tasCekildiMi) ? 'inline-block' : 'none';
        document.getElementById('btn-yandan-al').style.display = (siraBende && !state.tasCekildiMi && state.sonAtilanTas) ? 'inline-block' : 'none';

        // Benim Istakam
        if (benimKoltugum !== -1 && state.oyuncular[benimKoltugum]) {
            let ben = state.oyuncular[benimKoltugum];
            document.getElementById('benim-puan').innerText = `Seri Puanı: ${ben.acilanPuan} | Ceza: ${ben.ceza}`;

            let istakaDiv = document.getElementById('benim-istaka');
            istakaDiv.innerHTML = '';
            ben.taslar.forEach((t, tIdx) => {
                let tDiv = document.createElement('div');
                tDiv.className = `tas ${t.renk} ${seciliIndices.includes(tIdx) ? 'secili' : ''}`;
                tDiv.innerText = t.sayi === 0 ? 'J' : t.sayi;
                tDiv.onclick = () => tasSec(tIdx);
                istakaDiv.appendChild(tDiv);
            });
        }
    }

    // Akıllı Otomatik Sıralama (Seri Diz)
    function seriDiz() {
        if (benimKoltugum === -1 || !state) return;
        let taslar = state.oyuncular[benimKoltugum].taslar;
        const renkSira = { 'kirmizi': 1, 'siyah': 2, 'mavi': 3, 'sari': 4, 'sahte': 5 };
        taslar.sort((a, b) => {
            if (renkSira[a.renk] !== renkSira[b.renk]) return renkSira[a.renk] - renkSira[b.renk];
            return a.sayi - b.sayi;
        });
        seciliIndices = [];
        ekraniGuncelle();
    }

    // Akıllı Otomatik Sıralama (Çift Diz)
    function ciftDiz() {
        if (benimKoltugum === -1 || !state) return;
        let taslar = state.oyuncular[benimKoltugum].taslar;
        taslar.sort((a, b) => a.sayi - b.sayi);
        seciliIndices = [];
        ekraniGuncelle();
    }

    function tasAt() {
        if (seciliIndices.length !== 1) { alert("Atmak için tam 1 taş seçmelisin!"); return; }
        socket.emit('tasAt', { pIdx: benimKoltugum, tasIndex: seciliIndices[0] });
        seciliIndices = [];
    }

    function seriAc() {
        if (seciliIndices.length < 3) { alert("Seri açmak için en az 3 taş seçmelisin!"); return; }
        socket.emit('seriAc', { pIdx: benimKoltugum, seciliIndices });
        seciliIndices = [];
    }
</script>
</body>
</html>
